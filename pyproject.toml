[project]
name = "prompt-injection-soc-telemetry"
version = "0.2.0"
description = "Indirect prompt injection via attacker-controlled SOC/EDR telemetry, and three narrator defense tiers measured against it."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.40",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Inspect AI packaging of the same benchmark, for the inspect_evals register.
# The task reuses eval.judge unchanged, so it reports the same numbers as the
# offline harness in docs/RESULTS.md.
inspect = ["inspect_ai>=0.3.100"]
# The learned detector (detector/) is optional: it pulls torch and transformers,
# which the three narrator tiers and the eval harness do not need.
detector = ["torch>=2.4", "transformers>=4.44", "scikit-learn>=1.4", "numpy>=1.26"]

[project.scripts]
pi-eval = "eval.run_all:main"
pi-dashboard = "eval.dashboard:main"
pi-detector = "detector.experiment:main"
pi-redteam = "redteam.loop:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["telemetry", "injection_corpus", "narrator", "narrator.prompts", "eval", "detector", "redteam", "inspect_task"]

[tool.setuptools.package-data]
injection_corpus = ["*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["telemetry", "injection_corpus", "narrator", "eval", "detector", "redteam", "inspect_task"]
